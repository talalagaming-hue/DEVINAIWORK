name: sysrfx-core CI

on:
  push:
    branches: [main]
    paths:
      - "sysrfx-core/**"
      - ".github/workflows/sysrfx-core-ci.yml"
  pull_request:
    paths:
      - "sysrfx-core/**"
      - ".github/workflows/sysrfx-core-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sysrfx-core
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Test
        run: pytest -v
